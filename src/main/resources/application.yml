spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/effective_mobile
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.xml